<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Conversas de cultura · Guia líder loja</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,800&display=swap" rel="stylesheet">
<style>
:root{--red:#f5002b;--ink:#111;--paper:#f6f3ee;--paper2:#ece7df;--muted:#6b6560;
--sans:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;--cond:'Barlow Condensed','Arial Narrow',sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:var(--sans);color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased;font-size:20px;line-height:1.3}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
.disp{font-family:var(--cond);font-style:italic;font-weight:800;text-transform:uppercase;line-height:.92}
#app{height:100dvh;display:flex;flex-direction:column;max-width:560px;margin:0 auto;position:relative}
#top{display:flex;gap:4px;padding:10px 14px 6px;flex:none}
#top i{flex:1;height:5px;border-radius:9px;background:rgba(0,0,0,.15)}
#top i.d{background:var(--ink)}
.scr{flex:1;overflow:hidden;padding:18px 20px 24px}
#in{display:flex;flex-direction:column;gap:14px}
.scr.c{background:var(--bg,var(--paper));color:var(--fg,var(--ink))}
.step{font-weight:800;font-size:14px;text-transform:uppercase;letter-spacing:.08em;opacity:.75}
.big{font-size:clamp(34px,10.2vw,56px)}
.say,.ask,.do{border-radius:18px;padding:14px 16px;font-size:21px;line-height:1.3}
.say{background:#fff;color:var(--ink);border-left:6px solid var(--red)}
.ask{background:var(--ink);color:#fff}
.do{background:rgba(255,255,255,.75);color:var(--ink)}
.lab{display:block;font-family:var(--cond);font-weight:800;text-transform:uppercase;letter-spacing:.07em;font-size:14px;margin-bottom:3px;color:var(--red)}
.ask .lab{color:#ffd0d8}
.row{display:flex;gap:10px}
.logo{width:96px}
.chips{display:flex;gap:10px;margin:4px 0}
.chips span{width:58px;height:58px;border-radius:16px;background:var(--pc);display:grid;place-items:center;box-shadow:0 5px 0 rgba(0,0,0,.18)}
.chips img{height:36px}
.hd{display:flex;align-items:center;gap:14px}
.hd .ico{height:72px;padding:8px;flex:none}
.hd h2{font-size:clamp(28px,8.4vw,44px);min-width:0}
.ico{height:96px;align-self:flex-start;background:rgba(255,255,255,.55);border-radius:24px;padding:10px;box-shadow:0 6px 0 rgba(0,0,0,.12)}
.gest{font-size:24px;font-weight:800;line-height:1.15}
.gest small{display:block;font-weight:600;font-size:16px;opacity:.8;margin-top:2px}
#bar{display:flex;gap:10px;padding:10px 16px calc(12px + env(safe-area-inset-bottom));flex:none;background:var(--paper);border-top:1px solid #e2dcd2}
#bar button{min-height:58px;border-radius:999px;font-weight:800;font-size:1.1rem}
#prev{flex:0 0 30%;background:var(--paper2)}
#next{flex:1;background:var(--red);color:#fff}
#next.ink{background:var(--ink)}
#prev[disabled]{opacity:.35;pointer-events:none}
/* jogo */
.sit{background:#fff;color:var(--ink);border-radius:22px;padding:20px;font-size:26px;font-weight:700;line-height:1.2;min-height:150px;display:flex;align-items:center}
.pills{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pills span{min-width:0;border-radius:16px;padding:8px 10px;background:var(--pc);color:var(--pt);font-weight:800;display:flex;align-items:center;gap:8px;font-family:var(--cond);text-transform:uppercase;font-size:15px;white-space:nowrap;letter-spacing:-.01em}
.pills img{height:22px}
.pills.cov{grid-template-columns:1fr}
.pills.cov span{box-shadow:0 4px 0 rgba(0,0,0,.18);font-size:24px;padding:8px 14px;gap:12px}
.pills.cov img{height:36px}
.steps{counter-reset:s;list-style:none;display:flex;flex-direction:column;gap:10px}
.steps li{counter-increment:s;display:flex;gap:12px;background:#fff;border-radius:16px;padding:12px 14px;font-size:19px;line-height:1.3}
.steps li span{flex:1;min-width:0}
.steps li::before{content:counter(s);font-family:var(--cond);font-weight:800;font-size:26px;color:#fff;background:var(--red);width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none}
.oath{background:#fff;border-radius:22px;padding:16px 16px 12px;position:relative;box-shadow:0 6px 0 rgba(0,0,0,.12)}
.shield{position:absolute;right:12px;top:-18px;width:52px;transform:rotate(8deg)}
.ot{font-family:var(--cond);font-style:italic;font-weight:800;text-transform:uppercase;font-size:clamp(24px,7vw,30px);line-height:1;margin-bottom:10px;max-width:70%}
.ol{display:flex;align-items:center;gap:10px;font-weight:700;font-size:19px;margin:6px 0}
.ol span{width:38px;height:38px;border-radius:12px;background:var(--pc);display:grid;place-items:center;flex:none}
.ol img{height:24px}
.fr2{display:flex;gap:12px;align-items:flex-start}
.fr2>div:last-child{flex:1;min-width:0}
.ph{flex:none;width:104px}
.fr2 b{overflow-wrap:anywhere}
.ph svg{display:block;width:100%;height:auto}
.minicard{align-self:center;width:min(250px,72%);background:#fff;border-radius:20px;border:3px solid var(--ink);box-shadow:0 6px 0 rgba(0,0,0,.14);padding:10px;transform:rotate(-2deg);text-align:center}
.minicard .mh{font-family:var(--cond);font-style:italic;font-weight:800;text-transform:uppercase;font-size:15px;color:var(--red);text-align:left}
.minicard .mp{margin:6px 0;border:2.5px dashed var(--red);border-radius:12px;padding:8px;display:flex;align-items:center;justify-content:center;gap:10px;background:var(--paper)}
.minicard .mp svg{width:40px;flex:none}
.minicard .mp b{font-family:var(--cond);text-transform:uppercase;font-size:18px;color:var(--red)}
.minicard .mn{font-weight:800;font-size:15px}
.minicard .ms{display:flex;justify-content:center;gap:6px;margin:6px 0 4px}
.minicard .ms span{width:34px;height:34px;border-radius:50%;background:var(--pc);border:2.5px solid var(--ink);display:grid;place-items:center}
.minicard .ms img{height:20px}
.minicard .mt{font-family:var(--cond);font-weight:800;text-transform:uppercase;font-size:15px}
.shield2{width:70px;transform:rotate(-6deg)}
.shield2 svg{display:block;width:100%;height:auto}
.tk{font-size:21px;line-height:1.3}
.ask2{background:#fff;color:var(--ink);border-radius:18px;padding:14px 16px;font-size:21px;font-weight:700;line-height:1.25}
.fin em{color:var(--red)}
.chips.big4{gap:12px}
.chips.big4 span{width:70px;height:70px}
.chips.big4 img{height:44px}
.fin{font-family:var(--cond);font-style:italic;font-weight:800;text-transform:uppercase;font-size:clamp(30px,9vw,42px);line-height:.98}
.qrrow{display:flex;gap:14px;align-items:center;justify-content:center}
.minicard.sm{width:150px;align-self:auto;padding:8px;flex:none}
.minicard.sm .ms span{width:28px;height:28px}
.minicard.sm .ms img{height:16px}
.minicard.sm .mp{padding:14px 6px}
.qrrow p{font-size:17px;font-weight:600}
.btn2.rd{background:var(--red);color:#fff}
.modebox{margin-top:4px}
.modebox span{display:block;font-weight:800;font-size:14px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
.mode{display:flex;gap:6px;background:rgba(0,0,0,.2);border-radius:999px;padding:4px}
.mode button{flex:1;min-height:46px;border-radius:999px;font-weight:800;font-size:16px;color:#fff;padding:0 8px}
.mode button.on{background:#fff;color:var(--red)}
html[data-mode=big] #app{max-width:900px}
.grito{background:rgba(255,255,255,.8);color:var(--ink);border-radius:18px;padding:14px 16px}
.grito div{font-family:var(--cond);font-weight:800;text-transform:uppercase;font-size:clamp(26px,8vw,34px);line-height:1.05;margin:4px 0}
.grito b{color:var(--red);font-style:italic}
.grito small{font-size:15px;font-weight:600;opacity:.8}
.fr{display:flex;gap:12px;align-items:center}
.fr>div:first-child{flex:1}
.fig{flex:none;width:104px;background:#fff;border-radius:16px;padding:6px}
.fig svg{display:block;width:100%;height:auto}
.cmb{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.cmb b{display:flex;align-items:center;gap:8px;font-family:var(--cond);text-transform:uppercase;font-size:19px;color:#fff;border-radius:12px;padding:8px 10px}
.cmb b svg{width:26px;height:26px;flex:none}
.cmb b.yes{background:#0a7a35}
.cmb b.no{background:#c4001a}
.cmb div.y{border-left:6px solid #0a7a35}
.cmb div.n{border-left:6px solid #c4001a}
.cmb div{background:rgba(255,255,255,.75);color:var(--ink);border-radius:12px;padding:10px 12px;font-weight:700;font-size:17px;line-height:1.2;display:flex;align-items:center}
.ans.big2{flex-direction:column;align-items:flex-start;padding:22px;gap:14px;border-radius:26px}
.ans.big2 img{height:96px}
.ans.big2 b{font-size:clamp(40px,12vw,56px);line-height:.95}
.why{font-weight:700;font-size:22px;line-height:1.3;margin-top:8px}
.why span{font-family:var(--cond);text-transform:uppercase;letter-spacing:.05em;font-size:16px;display:block;opacity:.75}
.ans{border-radius:22px;padding:16px;background:var(--pc);color:var(--pt);display:none;align-items:center;gap:14px}
.ans.on{display:flex}
.ans img{height:64px}
.ans b{font-size:34px}
.show{min-height:58px;border-radius:999px;background:var(--ink);color:#fff;font-weight:800}
.cnt{font-weight:800;font-size:15px;opacity:.7}
.qr{background:#fff;border-radius:18px;padding:10px;width:150px;flex:none}
.qr svg{display:block;width:100%;height:auto}
.btn2{min-height:54px;border-radius:999px;font-weight:800;background:#fff;color:var(--red);display:flex;align-items:center;justify-content:center;text-decoration:none;width:100%}
.btn2.k{background:var(--ink);color:#fff}
ul.rl{list-style:none}
ul.rl li{padding:6px 0;border-bottom:1px solid rgba(255,255,255,.3);font-size:19px}
</style>
</head>
<body>

  <div id="top"></div>
  <div class="scr" id="scr"></div>
  <div id="bar"><button id="prev" type="button">Voltar</button><button id="next" type="button">Começar</button></div>
</div>

  +'<li><span><b>Conquiste os 4 selos.</b> Acertou as 2 situações de um pilar? O selo é seu.</span></li>'
  +'<li><span><b>Gere o seu card</b> com a sua foto e poste no grupo da loja.</span></li></ol>'},
 {h:'<div class="step">5 de 5 · Desafio</div><h2 class="disp big">Seu card de craque está esperando!</h2>'
  +'<div class="say"><span class="lab">Diga</span>O desafio faz parte da nossa conversa de cultura. Jogue, conquiste os 4 selos, gere o card com a sua foto e poste no grupo da loja. Depois convide um colega: cultura boa se espalha.</div>'
  +'<div class="qrrow"><div class="minicard sm"><div class="mh">Jeito KFC de ser</div><div class="mp"><b>Sua foto</b></div><div class="ms">'+K.map(function(k){return '<span style="--pc:'+P[k].cor+'"><img src="'+P[k].ico+'" alt=""></span>'}).join('')+'</div><div class="mt">4 selos</div></div><div class="qr">'+QR+'</div></div>'
  +'<a class="btn2 rd" href="'+GAME+'" target="_blank" rel="noopener">Abrir o jogo</a>'
  +'<button class="btn2 k" id="share" type="button">Enviar o desafio para o grupo da loja</button>'},
 {last:1,h:'<div class="shield2">'+SHIELD+'</div>'
  +'<h2 class="disp big">Agradecemos por fazer parte!</h2>'
  +'<p class="tk">A cultura KFC não está no papel nem nesta tela. Ela está em cada atitude de vocês, todos os dias.</p>'
  +'<p class="tk">Cada escolha de hoje constrói a cultura que a gente quer viver.</p>'
  +'<div class="chips big4">'+CHIPS()+'</div>'
  +'<div class="fin">Todos nós somos <em>guardiões</em> da cultura KFC.</div>'}
];
function render(){
  var s=S[gi],el=document.getElementById('scr'),next=document.getElementById('next'),prev=document.getElementById('prev');
  shown=false;
  var top='';for(var i=0;i<S.length;i++)top+='<i class="'+(i<=gi?'d':'')+'"></i>';
  document.getElementById('top').innerHTML=top;
  if(s.game){si=0;gameRender();}
  else{el.className='scr'+(s.c?' c':'');el.style.setProperty('--bg',s.bg||'');el.style.setProperty('--fg',s.fg||'');el.innerHTML='<div id="in">'+s.h+'</div>';}
  if(s.c){document.getElementById('app').style.background=s.bg}else{document.getElementById('app').style.background=''}
  prev.disabled=gi===0;
  next.textContent=s.next||(s.last?'Recomeçar':(gi===S.length-2?'Continuar':'Próximo'));
  next.className=s.last?'ink':'';
  if(s.game)next.textContent='Mostrar a resposta';
  fit();
  wireMode();
  var sh=document.getElementById('share');
  if(sh)sh.onclick=function(){var t='Time, o desafio do Jeito KFC de Ser faz parte da nossa conversa de cultura. Depois da conversa, joguem pelo celular e gerem o seu card: '+GAME;
    if(navigator.share){navigator.share({text:t}).catch(function(){})}
    else if(navigator.clipboard){navigator.clipboard.writeText(t).then(function(){sh.textContent='Link copiado!'}).catch(function(){window.prompt('Copie:',t)})}
    else window.prompt('Copie:',t)};
}
var MODE=(window.innerWidth>=700)?'big':'cel';
document.documentElement.setAttribute('data-mode',MODE);
var si=0;
function wireMode(){
  var bs=document.querySelectorAll('.mode button');
  for(var i=0;i<bs.length;i++){(function(b){
    b.classList.toggle('on',b.getAttribute('data-m')===MODE);
    b.onclick=function(){MODE=b.getAttribute('data-m');document.documentElement.setAttribute('data-mode',MODE);wireMode();fit();};
  })(bs[i]);}
}
function fit(){
  var el=document.getElementById('scr'),inn=document.getElementById('in');if(!inn)return;
  var z=MODE==='big'?1.9:1;inn.style.zoom=z;
  var cs=getComputedStyle(el),avail=el.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
  while(z>.55&&inn.getBoundingClientRect().height>avail){z=Math.round((z-.03)*100)/100;inn.style.zoom=z;}
}
window.addEventListener('resize',fit);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit);
function gameRender(){
  var el=document.getElementById('scr');el.className='scr';el.style.removeProperty('--bg');
  var q=SIT[si],p=P[q.k];
  var ans='<div class="ans'+(shown?' on big2':'')+'" style="--pc:'+p.cor+';--pt:'+p.tinta+'"><img src="'+p.ico+'" alt=""><div><b class="disp">'+p.nome+'</b><div class="why"><span>Por quê?</span> '+q.x+'</div></div></div>';
  if(shown){
    el.innerHTML='<div id="in"><div class="step">3 de 5 · Qual pilar é?</div><h2 class="disp big">Jogo rápido</h2>'
    +'<p class="cnt">Pergunta '+(si+1)+' de '+SIT.length+' · Resposta</p>'+ans+'</div>';
  } else {
    el.innerHTML='<div id="in"><div class="step">3 de 5 · Qual pilar é?</div><h2 class="disp big">Jogo rápido</h2>'
    +'<div class="say"><span class="lab">Diga</span>Eu leio a situação e faço uma pergunta. Quem quer responder? O time pode ajudar.</div>'
    +'<p class="cnt">Pergunta '+(si+1)+' de '+SIT.length+'</p>'
    +'<div class="sit"><div>'+q.t+'<div style="margin-top:10px;color:var(--red)">Qual pilar é esse?</div></div></div>'
    +'<div class="pills">'+PILLS()+'</div></div>';
  }
  fit();
  var nb=document.getElementById('next');nb.className='';
  nb.textContent=shown?(si<SIT.length-1?'Próxima pergunta':'Continuar'):'Mostrar a resposta';
}
document.getElementById('next').onclick=function(){
  if(S[gi].game){
    if(!shown){shown=true;gameRender();}
    else if(si<SIT.length-1){si++;shown=false;gameRender();}
    else{gi++;si=0;shown=false;render();}
    return;}
  if(S[gi].last){gi=0;si=0}else if(gi<S.length-1)gi++;render()};
document.getElementById('prev').onclick=function(){
  if(S[gi].game){
    if(shown){shown=false;gameRender();return;}
    if(si>0){si--;gameRender();return;}}
  if(gi>0){gi--;render()}};
render();
</script>
</body>
</html>
